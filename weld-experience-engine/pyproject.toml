[project]
name = "weldcore"
version = "0.1.0"
description = "焊接技能大师经验结构化引擎 (POC 种子)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "openpyxl>=3.1"]

[project.optional-dependencies]
viz = ["rerun-sdk>=0.15"]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
